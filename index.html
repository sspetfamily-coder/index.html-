<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&amp;S Pet Family</title>
<meta name="description" content="S&S Pet Family — Bessa, João Pessoa. Agende, ligue, chame no WhatsApp ou avalie nosso atendimento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613;
    --red-dark:#B10510;
    --black:#161311;
    --white:#FFFFFF;
    --gray:#EDEDED;
    --orange:#F4900C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100svh;
    font-family:'Nunito', sans-serif;
    color:var(--white);
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(0,0,0,0.35), transparent 45%),
      linear-gradient(160deg, var(--red) 0%, var(--red) 55%, var(--red-dark) 100%);
    display:flex;
    justify-content:center;
    padding:0 0 60px;
    position:relative;
    overflow-x:hidden;
  }
  .paw-bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .paw-bg svg{
    position:absolute;
    fill:rgba(255,255,255,0.10);
  }
  .paw-bg svg:nth-child(1){ width:70px; top:6%;  left:6%;  transform:rotate(-18deg); }
  .paw-bg svg:nth-child(2){ width:46px; top:16%; right:9%; transform:rotate(22deg); fill:rgba(0,0,0,0.14); }
  .paw-bg svg:nth-child(3){ width:56px; top:38%; left:2%;  transform:rotate(10deg); }
  .paw-bg svg:nth-child(4){ width:38px; top:52%; right:4%; transform:rotate(-12deg); fill:rgba(0,0,0,0.14); }
  .paw-bg svg:nth-child(5){ width:64px; top:68%; left:8%;  transform:rotate(-25deg); }
  .paw-bg svg:nth-child(6){ width:50px; top:80%; right:10%;transform:rotate(16deg); fill:rgba(0,0,0,0.14); }
  .paw-bg svg:nth-child(7){ width:40px; top:92%; left:14%; transform:rotate(30deg); }

  .card{
    width:100%;
    max-width:440px;
    padding:44px 24px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }
  .logo-ring{
    width:168px; height:168px;
    border-radius:50%;
    padding:6px;
    background:var(--white);
    box-shadow:0 14px 34px rgba(0,0,0,0.35);
  }
  .logo-ring img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.6rem;
    letter-spacing:0.01em;
    text-align:center;
    margin-top:22px;
    text-shadow:0 2px 10px rgba(0,0,0,0.2);
  }
  .divider{
    display:flex; align-items:center; gap:12px;
    margin:14px 0 30px;
    width:100%;
  }
  .divider span:first-child, .divider span:last-child{
    flex:1; height:2px; background:rgba(255,255,255,0.55);
    border-radius:2px;
  }
  .divider p{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.82rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    white-space:nowrap;
    color:rgba(255,255,255,0.9);
  }
  .buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:rgba(255,255,255,0.14);
    border:2px solid rgba(255,255,255,0.85);
    border-radius:14px;
    padding:16px 14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1rem;
    color:var(--white);
    text-decoration:none;
    text-align:center;
    backdrop-filter:blur(2px);
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{ background:rgba(255,255,255,0.26); transform:translateY(-2px); }
  .btn:active{ transform:translateY(0); }
  .btn svg{ width:20px; height:20px; fill:var(--white); flex-shrink:0; }
  .btn.solid{
    background:var(--black);
    border-color:var(--black);
  }
  .btn.solid:hover{ background:#000; }
  .btn.accent{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--black);
  }
  .btn.accent svg{ fill:var(--black); }
  .btn.accent:hover{ background:#ffa41f; }

  footer{
    margin-top:36px;
    text-align:center;
    font-weight:700;
    font-size:0.85rem;
    color:rgba(255,255,255,0.85);
    padding-bottom:10px;
  }
  footer .addr{
    display:block;
    margin-top:6px;
    font-weight:600;
    font-size:0.78rem;
    color:rgba(255,255,255,0.72);
  }
  .icon-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:16px 0 14px;
  }
  .icon-row a{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.22);
    transition:transform .15s ease;
  }
  .icon-row a:hover{ transform:translateY(-3px); }
  .icon-row a svg{ width:22px; height:22px; }
  .icon-row a[aria-label="Instagram"] svg{ fill:var(--red); }
  .icon-row a[aria-label="WhatsApp"] svg{ fill:#1FA855; }
  .icon-row a[aria-label="Localização"] svg{ fill:var(--red); }

  a:focus-visible, .btn:focus-visible{
    outline:3px solid var(--black);
    outline-offset:2px;
  }

  @media (max-width:380px){
    .logo-ring{width:140px; height:140px;}
    h1{font-size:1.35rem;}
  }
</style>
</head>
